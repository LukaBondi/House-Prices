name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Ensure model artifact exists
        run: |
          if [ ! -f models/baseline_xgb_pipeline.pkl ]; then
            python model_training/train_baseline.py
          fi

      - name: Lint with ruff
        run: |
          ruff check backend tests model_training/train_baseline.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: |
          pytest -q
