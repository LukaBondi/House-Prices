name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js for dashboard behavior checks
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install project dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r model_training/requirements-trainer.txt

      - name: Verify frozen artifacts and continual-learning references
        run: |
          test -s models/baseline_xgb_pipeline.pkl
          test -s models/house_prices_native.zip
          test -s models/feature_schema.json
          test -s dataset/split_manifest.json
          test -s models/drift_reference.json
          test "$(sha256sum models/baseline_xgb_pipeline.pkl | cut -d ' ' -f 1)" = "0eed717dd49aa5b5e307577d14b8e11bca813c131f35dc39fb9e41a7c9c26d42"
          python -m model_training.data_partitions --check dataset/split_manifest.json
          mkdir -p tmp
          frozen_native_sha="$(sha256sum models/house_prices_native.zip | cut -d ' ' -f 1)"
          python -m model_training.export_native --output tmp/ci-native-parity.zip
          test -s tmp/ci-native-parity.zip
          test "$(sha256sum models/house_prices_native.zip | cut -d ' ' -f 1)" = "$frozen_native_sha"
          python -m model_training.build_drift_reference --manifest dataset/split_manifest.json --output tmp/ci-drift-reference.json
          cmp models/drift_reference.json tmp/ci-drift-reference.json

      - name: Lint with Ruff
        run: |
          ruff check backend tests model_training/*.py tools/*.py

      - name: Run tests
        env:
          PYTHONPATH: .
        run: pytest -q

      - name: Check and exercise dashboard behavior
        run: |
          node --check frontend/dashboard.js
          node --test tests/dashboard_behavior.test.cjs

  linux-compose-smoke:
    runs-on: ubuntu-latest
    env:
      ADMIN_TOKEN: "${{ github.run_id }}-${{ github.run_attempt }}"
      RETRAIN_INTERVAL_SECONDS: "5"
      COMPOSE_PROJECT_NAME: "house-prices-ci-${{ github.run_id }}-${{ github.run_attempt }}"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Mask the temporary integration token
        shell: bash
        run: printf '::add-mask::%s\n' "$ADMIN_TOKEN"

      - name: Validate Compose configuration
        run: docker compose config -q

      - name: Build and start Linux containers
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Probe nginx, API audit, delayed labels, timed retraining, and restart persistence
        shell: bash
        run: |
          mkdir -p tmp
          python tools/smoke_stack.py \
            --base-url http://127.0.0.1:3000/api \
            --frontend-url http://127.0.0.1:3000 \
            --trainer-service trainer \
            --exercise-request-events \
            --exercise-adaptation \
            --require-timed-retraining \
            --exercise-promotion-fixture \
            --exercise-restart \
            --request-count 40 \
            --minimum-labels 32 \
            --label-delay-seconds 1 \
            --retrain-timeout 240 \
            --trainer-timeout 300 \
            2>&1 | tee tmp/docker-smoke-result.json

      - name: Collect container logs
        if: always()
        shell: bash
        run: |
          mkdir -p tmp
          docker compose logs --no-color > tmp/compose-logs.txt 2>&1 || true

      - name: Upload Docker smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-compose-smoke-${{ github.run_id }}
          path: |
            tmp/compose-logs.txt
            tmp/docker-smoke-result.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove containers and named volumes
        if: always()
        shell: bash
        run: docker compose down --volumes --remove-orphans || true
